<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>呆宝工具箱</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- 顶部导航 -->
    <header class="app-header">
      <div class="brand">
        <img src="assets/logo.png" alt="呆宝工具箱" class="brand-icon">
        <h1 class="brand-name">呆宝工具箱</h1>
      </div>
      <nav class="main-nav" id="mainNav">
        <ul class="nav-list">
          <li class="nav-item active" data-category="finance">
            <span class="nav-icon">💰</span>
            <span class="nav-text">财务工具</span>
          </li>
          <li class="nav-item" data-category="dev">
            <span class="nav-icon">💻</span>
            <span class="nav-text">开发工具</span>
          </li>
          <li class="nav-item" data-category="office">
            <span class="nav-icon">📄</span>
            <span class="nav-text">办公工具</span>
          </li>
          <li class="nav-item" data-category="life">
            <span class="nav-icon">🏠</span>
            <span class="nav-text">生活工具</span>
          </li>
          <li class="nav-item" data-category="other">
            <span class="nav-icon">🧩</span>
            <span class="nav-text">其他分类</span>
          </li>
        </ul>
      </nav>
    </header>

    <!-- 二级工具导航 -->
    <div class="sub-nav-bar" id="subNavBar">
      <ul class="sub-nav-list" id="subNavList">
        <!-- 由 JS 动态渲染 -->
      </ul>
    </div>

    <!-- 主内容区 -->
    <main class="app-main" id="appMain">
      <!-- 由 JS 动态渲染 -->
    </main>

    <footer class="app-footer">
      <p>呆宝工具箱 · 本地单页应用 · 原生 HTML + CSS + JavaScript</p>
    </footer>
  </div>

  <script src="js/tools/shared.js"></script>
  <script src="js/tools/vat-calculator.js"></script>
  <script src="js/tools/json-formatter.js"></script>
  <script src="js/tools/base64-tool.js"></script>
  <script src="js/tools/timestamp-tool.js"></script>
  <script src="js/tools/word-count.js"></script>
  <script src="js/tools/case-convert.js"></script>
  <script src="js/tools/date-calculator.js"></script>
  <script src="js/tools/bmi-calculator.js"></script>
  <script src="js/tools/random-generator.js"></script>
  <script src="js/tools/color-picker.js"></script>
  <script src="js/tools/tax-calculator.js"></script>
  <script src="js/tools/password-generator.js"></script>
  <script src="js/tools/unit-converter.js"></script>
  <script src="js/tools/text-process.js"></script>
  <script src="js/tools/regex-tester.js"></script>
  <script src="js/tools/url-codec.js"></script>
  <script src="js/tools/jwt-parser.js"></script>
  <script src="js/tools/text-diff.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
